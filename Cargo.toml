[package]
name = "aruaru-vpn"
version = "0.1.0"
edition = "2024"

[dependencies]
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
rand = "0.10.3"
rand_core = "0.10.1"
rcgen = "0.14.10"
rustls = "0.23.45"
